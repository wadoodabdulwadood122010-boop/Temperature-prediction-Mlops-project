name: CI Pipeline

on: push

jobs:
  project-testing:
    runs-on: ubuntu-latest

    steps:
      - name: checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: setup python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: install dependencies
        run: |
          pip install -r requirements.txt

      - name: run pipeline
        env:
          DAGSHUB_TOCKEN: ${{ secrets.DAGSHUB_TOCKEN }}
        run: |
          git rm -r --cached 'data/'
          git rm -r --cached 'reports/'
          git rm -r --cached 'models/'
          dvc repro


      - name: Promote model to production
        if: success()
        env:
          DAGSHUB_TOCKEN: ${{ secrets.DAGSHUB_TOCKEN }}
        run: python production_grade/model_to_production.py


      - name: Login to AWS ECR
        if: success()
        run: |
            aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY }}
            aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            aws configure set region ${{ secrets.AWS_REGION }}
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Build Docker image
        # Fix: Build it directly with the full ECR path to avoid retagging complexity
        run: |
          docker build -t ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:V3 .

      - name: Push Docker image to ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/${{ secrets.ECR_REPOSITORY }}:V3

      - name: Set Up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest' # Fix: 'V2' is likely not a valid kubectl version

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig --region us-east-1 --name my-app-cluster

      - name: Create Kubernetes Secret
        # (Your existing secret step is fine)
        run: |
          kubectl create secret generic capstone-secret \
            --from-literal=DAGSHUB_TOCKEN=${{ secrets.DAGSHUB_TOCKEN }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to EKS
        run: |
          # 1. Apply the deployment configuration
          kubectl apply -f deployment.yaml
          
          # 2. ⚡ CRITICAL FIX: Force Kubernetes to re-pull the V2 image
          # Since the tag name "V2" didn't change, we must force a restart.
          kubectl rollout restart deployment temprerature-prediction